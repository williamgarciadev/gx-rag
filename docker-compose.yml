services:
  # Vector store DEDICADO a gx-rag. Deliberadamente NO se reusa el `postgres-main`
  # del VPS: ese motor lo comparten banco_contactar_db, magis y gxapp_db, no trae
  # pgvector, y meterle una extensión sería poner en riesgo tres bases de
  # producción ajenas para ahorrar un contenedor.
  #
  # Sin puerto publicado: sólo alcanzable por la red interna, igual que
  # `postgres-main`. El DSN usa el nombre del servicio como host.
  #
  # ⚠️ En el VPS este contenedor se creó a mano con `docker run` (2026-08-11) para
  # no gatillar un `compose up` que habría recreado gx-rag-api/ui de paso. Como no
  # tiene labels de compose, el primer `docker compose up -d` va a fallar con
  # "container name already in use": hay que `docker rm -f gx-rag-pg` ANTES y
  # dejar que compose lo cree. **El volumen gx-rag-pgdata persiste**, así que los
  # datos y el corpus indexado sobreviven a ese reemplazo.
  gx-rag-pg:
    image: pgvector/pgvector:pg16
    container_name: gx-rag-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: gxrag
      POSTGRES_DB: gxrag
      # Sin default a propósito: si falta, el contenedor no arranca en vez de
      # quedar con una password vacía.
      POSTGRES_PASSWORD: ${GXRAG_PG_PASSWORD:?definí GXRAG_PG_PASSWORD en .env}
    networks:
      - infra_gateway
    volumes:
      - gx-rag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gxrag -d gxrag"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Public, internet-facing MCP endpoint (read-only tools) behind Traefik + TLS.
  gx-rag-mcp:
    build: .
    image: gx-rag-mcp:latest
    container_name: gx-rag-mcp
    restart: unless-stopped
    # Single worker: the rate-limit / auth-failure counters are per-process
    # (in-memory). More than one worker multiplies the effective limits.
    command: ["uvicorn", "src.http_server:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
    env_file: .env
    networks:
      - infra_gateway
    volumes:
      # rw: ChromaDB opens its SQLite read-write even for queries. Write SAFETY
      # is enforced at the app layer (public transport exposes read-only tools).
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_gateway"
      - "traefik.http.routers.gxrag-mcp.rule=Host(`gxrag.wgsoft.com.co`)"
      # entrypoint + certResolver names verified against the VPS Traefik and the
      # convention already used by other services (magis, etc.).
      - "traefik.http.routers.gxrag-mcp.entrypoints=websecure"
      - "traefik.http.routers.gxrag-mcp.tls.certResolver=letsencrypt"
      - "traefik.http.services.gxrag-mcp.loadbalancer.server.port=8080"

  # Admin Ingestor API — NOT internet-exposed. No host port, no Traefik labels.
  # Reach it for curation via an SSH tunnel:  ssh -L 8000:gx-rag-api:8000 vps
  # (or add Traefik labels + a basic-auth middleware on a separate hostname).
  gx-rag-api:
    build: .
    image: gx-rag-api:latest
    container_name: gx-rag-api
    restart: unless-stopped
    networks:
      - infra_gateway
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Curator UI — internal only (no host port, no Traefik labels). Served to
  # curators through the SSH tunnel / private access, never to the internet.
  gx-rag-ui:
    build: ./frontend
    image: gx-rag-ui:latest
    container_name: gx-rag-ui
    restart: unless-stopped
    networks:
      - infra_gateway
    depends_on:
      gx-rag-api:
        condition: service_healthy

networks:
  infra_gateway:
    external: true

volumes:
  # El corpus indexado vive acá, NO en la imagen. Sobrevive a un `docker rm` del
  # contenedor, que es lo que hace posible reemplazar el gx-rag-pg creado a mano
  # por el que gestione compose sin perder los datos.
  gx-rag-pgdata:
